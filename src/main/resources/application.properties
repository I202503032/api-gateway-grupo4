
spring.application.name=api-gateway-grupo4
server.port=8070

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webflux.routes[0].id=pedido-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://PEDIDO-SERVICE-GRUPO4
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/pedidos/**

spring.cloud.gateway.server.webflux.routes[1].id=pago-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PAGO-SERVICE-GRUPO4
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/pagos/**

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
